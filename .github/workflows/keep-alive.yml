name: Supabase keep-alive

# Free Supabase projects pause after 1 week of inactivity; one REST read every 3 days counts as activity.
# The anon key is public by design (it ships in the client code), so it is safe inline.

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the potluck-signup project
        run: |
          curl --fail --silent --show-error \
            "https://lccfhahuwlddmqqntghj.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjY2ZoYWh1d2xkZG1xcW50Z2hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NjkzNTIsImV4cCI6MjExMDM0NTM1Mn0.QD_S-sFMjYobpec3OLqEbPIr6OwyPIkBEhGWmxRIizk" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjY2ZoYWh1d2xkZG1xcW50Z2hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NjkzNTIsImV4cCI6MjExMDM0NTM1Mn0.QD_S-sFMjYobpec3OLqEbPIr6OwyPIkBEhGWmxRIizk"
